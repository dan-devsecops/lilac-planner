# Self-hosted SonarQube Community Edition (SAST + code quality) - local-only,
# manual tooling. Not part of the default dev/prod stack, and deliberately NOT
# wired into GitHub Actions ci.yml: this repo is public, and GitHub Actions
# self-hosted runners must never be used on a public repo - a workflow run
# triggered by any fork's pull_request can execute arbitrary code on whatever
# host the runner is registered on. Bring this up when you want to run a scan
# by hand:
#
#   docker compose -f docker-compose-sonarqube.yml up -d
#
# First-run setup (one-time, manual):
#   1. Open http://localhost:9000, log in with admin/admin, set a new password.
#   2. Create two projects with these exact keys (they must match
#      `sonar.projectKey` in backend/pom.xml and frontend/sonar-project.properties):
#      lilac-planner-backend, lilac-planner-frontend.
#   3. My Account → Security → Generate Token (type: User Token).
#   4. One-time: `brew install sonar-scanner` (macOS) - the frontend scan needs
#      the scanner CLI; Maven already carries it for the backend via the
#      sonar-maven-plugin declared in backend/pom.xml.
#   5. Run a scan locally, e.g.:
#        cd backend && mvn -B verify sonar:sonar -Dsonar.host.url=http://localhost:9000 -Dsonar.token=<token>
#        cd frontend && npm run test:coverage && \
#          sonar-scanner -Dsonar.host.url=http://localhost:9000 -Dsonar.token=<token>
#
# Community Edition only supports PostgreSQL as its own backing store - this is
# unrelated to PLANNER_DB and must not be reused for app data.
#
# Common first-run gotcha: SonarQube's embedded Elasticsearch requires
# vm.max_map_count >= 262144 on the Docker host. Docker Desktop for Mac's VM
# usually already satisfies this; if the container exits with a bootstrap-check
# error, see https://docs.sonarsource.com/sonarqube/latest/setup-and-upgrade/prerequisites-and-overview/.
#
# Image tag: "lts-community" tracks SonarQube's latest Long-Term-Active Community
# Edition release. Unlike the pinned versions elsewhere in this repo, a security
# scanner benefits more from automatic patch/rule updates than from strict
# reproducibility - bump to an exact version pin if you need deterministic builds.
name: lilac-planner-sonarqube

services:
  sonarqube-db:
    image: postgres:16
    container_name: lilac-sonarqube-db
    environment:
      POSTGRES_USER: sonarqube
      POSTGRES_PASSWORD: sonarqube
      POSTGRES_DB: sonarqube
    volumes:
      - sonarqube_db_data:/var/lib/postgresql/data
    restart: unless-stopped

  sonarqube:
    image: sonarqube:lts-community
    container_name: lilac-sonarqube
    depends_on:
      - sonarqube-db
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/sonarqube
      SONAR_JDBC_USERNAME: sonarqube
      SONAR_JDBC_PASSWORD: sonarqube
    ports:
      - "9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    restart: unless-stopped

volumes:
  sonarqube_db_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs: