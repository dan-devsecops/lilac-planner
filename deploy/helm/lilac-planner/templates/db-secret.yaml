{{- /*
  Chart-managed DB credentials Secret.
  Skipped entirely when db.existingSecret is set (you bring your own).
*/ -}}
{{- if not .Values.db.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "lilac.db.secretName" . }}
  labels:
    {{- include "lilac.labels" . | nindent 4 }}
type: Opaque
stringData:
  MARIADB_USER: {{ .Values.db.user | quote }}
  MARIADB_PASSWORD: {{ .Values.db.password | quote }}
  {{- if eq .Values.db.mode "embedded" }}
  MARIADB_ROOT_PASSWORD: {{ .Values.db.rootPassword | quote }}
  MARIADB_DATABASE: {{ .Values.db.name | quote }}
  {{- end }}
{{- end }}
