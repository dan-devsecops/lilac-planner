apiVersion: v1
kind: Service
metadata:
  name: {{ include "lilac.backend.fullname" . }}
  labels:
    {{- include "lilac.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: 8090
      targetPort: http
