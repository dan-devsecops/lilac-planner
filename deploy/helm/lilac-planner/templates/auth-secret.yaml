{{- /*
  Chart-managed native-auth Secret.
  Rendered only for provider=native without an existingSecret (you bring your own,
  e.g. synced from Key Vault / Secrets Manager). Holds the sensitive values only;
  non-sensitive config (provider, TTLs, URLs, admin username/email, mail host) is
  passed as plain env in the backend Deployment.
*/ -}}
{{- if and (eq .Values.auth.provider "native") (not .Values.auth.native.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "lilac.auth.secretName" . }}
  labels:
    {{- include "lilac.labels" . | nindent 4 }}
type: Opaque
stringData:
  PLANNER_JWT_SECRET: {{ required "auth.native.jwtSecret is required when auth.provider=native and auth.native.existingSecret is unset" .Values.auth.native.jwtSecret | quote }}
  {{- if .Values.auth.native.admin.password }}
  PLANNER_ADMIN_PASSWORD: {{ .Values.auth.native.admin.password | quote }}
  {{- end }}
  {{- if .Values.auth.native.mail.password }}
  MAIL_PASSWORD: {{ .Values.auth.native.mail.password | quote }}
  {{- end }}
{{- end }}
