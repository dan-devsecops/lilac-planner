[defaults]
; manual inventory
; inventory = inventory.ini
; dynamic inventory
inventory = inventory_terraform.py
retry_files_enabled = False

; group_vars/droplet/vault.yml (secrets for .env.prod) is ansible-vault-encrypted.
; Default: pass --ask-vault-pass on the command line
; read the passphrase from a local, gitignored file (deploy/ansible/.vault_pass)
; vault_password_file = .vault_pass
