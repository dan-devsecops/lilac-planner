auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2020-10-24
      store: boltdb-shipper
      object_store: filesystem
      schema: v11
      index:
        prefix: index_
        period: 24h

# Compactor must run for retention_period (below) to actually delete anything -
# without it, old chunks/index accumulate forever regardless of the limit.
compactor:
  working_directory: /loki/compactor
  retention_enabled: true

limits_config:
  # Keep this lean given the droplet's disk/memory budget - matches roughly the
  # same order of magnitude as Prometheus's default 15d metrics retention.
  retention_period: 168h

ruler:
  alertmanager_url: http://localhost:9093

# No usage data sent to Grafana Labs.
analytics:
  reporting_enabled: false
