services:
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    container_name: lilac-keycloak
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HTTP_PORT: 8080
      KC_HOSTNAME: localhost
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "(echo > /dev/tcp/localhost/8080) 2>/dev/null && exit 0 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: unless-stopped

  keycloak-config:
    image: adorsys/keycloak-config-cli:latest-24
    environment:
      - KEYCLOAK_URL=http://keycloak:8080
      - KEYCLOAK_USER=${KEYCLOAK_ADMIN:-admin}
      - KEYCLOAK_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:-admin}
      - KEYCLOAK_AVAILABILITYCHECK_ENABLED=true
      - KEYCLOAK_AVAILABILITYCHECK_TIMEOUT=120s
      - IMPORT_VARSUBSTITUTION_ENABLED=true
      - IMPORT_PATH=/config
      - TESTUSER_PASSWORD=${TESTUSER_PASSWORD:-alice123}
    volumes:
      - ./config/keycloak:/config:ro
    depends_on:
      - keycloak

  # Enable SSO in backend and frontend by overriding the AUTH_ENABLED default from docker-compose.yml
  backend:
    depends_on:
      keycloak:
        condition: service_started
    environment:
      AUTH_ENABLED: "true"
      # JWKS is fetched over the Docker-internal hostname; the token's `iss` claim carries
      # the browser-facing URL (localhost, via the host port mapping) - keep them distinct.
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/lilac-planner/protocol/openid-connect/certs
      KEYCLOAK_ISSUER: http://localhost:8080/realms/lilac-planner
      KEYCLOAK_AUDIENCE: lilac-planner-app
      # Required whenever auth isn't none - Prometheus authenticates to
      # /actuator/prometheus with this instead of a user JWT (it can't hold one).
      PLANNER_METRICS_PASSWORD: ${PLANNER_METRICS_PASSWORD:?set PLANNER_METRICS_PASSWORD in .env}

  frontend:
    environment:
      AUTH_ENABLED: "true"
