services:
  backend:
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    container_name: lilac-postgres
    environment:
      POSTGRES_USER: ${PG_USER:-planner}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-planner}
      POSTGRES_DB: ${PG_DB:-lilac_planner}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-planner} -d ${PG_DB:-lilac_planner}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  postgres_data:
