name: CD (DigitalOcean Kubernetes)

on:
  # Manual-only: DOKS isn't an always-on environment like the DO droplet - the
  # cluster gets torn up/down for testing, so this must not auto-fire on every
  # push to main (it would just fail whenever the cluster is currently down).
  # Deploy the DOKS leg by running this via "Run workflow", picking whichever
  # branch/ref you want deployed.
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to deploy (12-char commit SHA). Empty = build & deploy the latest commit on the selected ref."
        required: false
        default: ""

concurrency:
  group: cd-prod-doks
  cancel-in-progress: false

permissions:
  contents: write # required to push the rendered values to gitops/doks

env:
  DEPLOY_SHA: ${{ github.sha }}
  REGISTRY_SERVER: registry.digitalocean.com/${{ vars.DO_REGISTRY_NAME }}
  REPO_URL: git@github.com:dan-devsecops/lilac-planner.git

jobs:
  build:
    name: Build & push ${{ matrix.component }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: inputs.tag == ''
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DO_TOKEN }}

      - name: Log in to DOCR
        run: doctl registry login --expiry-seconds 1200

      - name: Build image
        run: |
          set -euo pipefail
          TAG="${DEPLOY_SHA::12}"
          docker build -t "$REGISTRY_SERVER/lilac-planner-${{ matrix.component }}:$TAG" \
                       -t "$REGISTRY_SERVER/lilac-planner-${{ matrix.component }}:latest" \
                       "./${{ matrix.component }}"

      - name: Push image
        run: |
          set -euo pipefail
          TAG="${DEPLOY_SHA::12}"
          docker push "$REGISTRY_SERVER/lilac-planner-${{ matrix.component }}:$TAG"
          docker push "$REGISTRY_SERVER/lilac-planner-${{ matrix.component }}:latest"

  deploy:
    name: Deploy & verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    if: >
      always() && !cancelled() &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    environment: production
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Resolve image tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-${DEPLOY_SHA::12}}"
          echo "DEPLOY_TAG=$TAG" >> "$GITHUB_ENV"
          echo "Deploying image tag: $TAG"

      - uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DO_TOKEN }}

      - uses: azure/setup-kubectl@v4
      - uses: azure/setup-helm@v4

      - name: Install argocd CLI
        run: |
          set -euo pipefail
          curl -sSL -o /usr/local/bin/argocd \
            https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
          chmod +x /usr/local/bin/argocd

      - name: Get DOKS kubeconfig
        run: doctl kubernetes cluster kubeconfig save "${{ vars.DO_CLUSTER_NAME }}"

      - name: Ensure namespace
        run: kubectl create namespace lilac-planner --dry-run=client -o yaml | kubectl apply -f -

      - name: Sync DOCR pull secret (refreshed every run - the token DO issues is short-lived)
        run: |
          set -euo pipefail
          doctl registry docker-config --expiry-seconds 3600 > /tmp/docr-config.json
          kubectl create secret generic docr-pull-secret \
            --from-file=.dockerconfigjson=/tmp/docr-config.json \
            --type=kubernetes.io/dockerconfigjson \
            --namespace lilac-planner \
            --dry-run=client -o yaml | kubectl apply -f -
          rm -f /tmp/docr-config.json

      - name: Sync DB secret (fetched live from DO - no stored DB credentials/URLs in GitHub at all)
        env:
          DB_CLUSTER_NAME: ${{ vars.DO_DB_CLUSTER_NAME }}
          DB_POOL_NAME: ${{ vars.DO_DB_POOL_NAME }}
          DB_REPLICA_NAME: ${{ vars.DO_DB_REPLICA_NAME }}
        run: |
          set -euo pipefail
          # Only DO_TOKEN (already required above) and three stable NAME
          # variables are needed here - no DB_USER/DB_PASSWORD/DB_URL secrets.
          # The cluster/pool/replica are looked up live by name every run, so
          # nothing goes stale when DOKS + its DB get torn down and recreated
          # for testing - the names (derived from terraform's name_prefix) are
          # the only thing that has to stay the same across recreations.
          DB_CLUSTER_ID=$(doctl databases list --format ID,Name --no-header \
            | awk -v n="$DB_CLUSTER_NAME" '$2==n{print $1; exit}')
          if [ -z "$DB_CLUSTER_ID" ]; then
            echo "No DB cluster named '$DB_CLUSTER_NAME' found - is it provisioned, and does DO_DB_CLUSTER_NAME match terraform output db_cluster_name?" >&2
            exit 1
          fi

          PG_USER=$(doctl databases connection "$DB_CLUSTER_ID" --format User --no-header)
          PG_PASSWORD=$(doctl databases connection "$DB_CLUSTER_ID" --format Password --no-header)
          # Through PgBouncer (transaction mode), not the bare primary - see database.tf.
          # prepareThreshold=0 disables pgjdbc server-side prepared statements, required
          # under transaction-mode pooling (a statement can get bound to a physical
          # connection PgBouncer then swaps out mid-session otherwise).
          POOL_URI=$(doctl databases pool list "$DB_CLUSTER_ID" --format Name,URI --no-header \
            | awk -v n="$DB_POOL_NAME" '$1==n{print $2; exit}')
          PG_URL="jdbc:postgresql://${POOL_URI#postgresql://}&prepareThreshold=0"

          PG_REPLICA_URL=""
          if doctl databases replica list "$DB_CLUSTER_ID" --format Name --no-header | grep -qx "$DB_REPLICA_NAME"; then
            REPLICA_URI=$(doctl databases replica get "$DB_CLUSTER_ID" "$DB_REPLICA_NAME" --format URI --no-header)
            PG_REPLICA_URL="jdbc:postgresql://${REPLICA_URI#postgresql://}"
          fi

          # These never passed through `secrets.*`, so GitHub won't auto-redact them
          # from logs - mask explicitly.
          echo "::add-mask::$PG_PASSWORD"
          echo "::add-mask::$PG_URL"
          if [ -n "$PG_REPLICA_URL" ]; then echo "::add-mask::$PG_REPLICA_URL"; fi

          # Key names are PG_* to match backend.plannerDb=postgres in
          # values-overlay.yaml.tmpl (see _helpers.tpl's db.*EnvName helpers).
          kubectl create secret generic lilac-db \
            --from-literal=PG_USER="$PG_USER" \
            --from-literal=PG_PASSWORD="$PG_PASSWORD" \
            --from-literal=PG_URL="$PG_URL" \
            --from-literal=PG_REPLICA_URL="$PG_REPLICA_URL" \
            --namespace lilac-planner \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Install/upgrade ingress-nginx + cert-manager (idempotent)
        run: |
          set -euo pipefail
          helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
          helm repo add jetstack https://charts.jetstack.io
          helm repo update
          helm upgrade --install ingress-nginx ingress-nginx/ingress-nginx \
            -n ingress-nginx --create-namespace --wait --timeout 5m
          helm upgrade --install cert-manager jetstack/cert-manager \
            -n cert-manager --create-namespace --set crds.enabled=true --wait --timeout 5m

      - name: Apply ClusterIssuer
        env:
          LETSENCRYPT_EMAIL: ${{ vars.LETSENCRYPT_EMAIL }}
        run: envsubst '$LETSENCRYPT_EMAIL' < deploy/doks/cluster-issuer.yaml | kubectl apply -f -

      - name: Resolve INGRESS_HOST (nip.io from the LB IP, unless overridden)
        run: |
          set -euo pipefail
          if [ -n "${{ vars.INGRESS_HOST }}" ]; then
            echo "INGRESS_HOST=${{ vars.INGRESS_HOST }}" >> "$GITHUB_ENV"
            echo "Using the configured INGRESS_HOST variable: ${{ vars.INGRESS_HOST }}"
            exit 0
          fi

          # No INGRESS_HOST variable set - this cluster gets torn down/recreated
          # for testing, so the LB IP (and therefore the nip.io hostname) changes
          # every time. Derive it fresh from the Load Balancer instead of relying
          # on a GitHub variable someone has to remember to update.
          echo "No INGRESS_HOST variable set - deriving one from the ingress-nginx LB IP..."
          LB_IP=""
          for i in $(seq 1 30); do
            LB_IP=$(kubectl get svc -n ingress-nginx ingress-nginx-controller \
              -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || true)
            [ -n "$LB_IP" ] && break
            sleep 10
          done
          if [ -z "$LB_IP" ]; then
            echo "Timed out waiting for the ingress-nginx LoadBalancer to get an external IP." >&2
            exit 1
          fi

          echo "INGRESS_HOST=planner.${LB_IP}.nip.io" >> "$GITHUB_ENV"
          echo "Derived INGRESS_HOST=planner.${LB_IP}.nip.io from LB IP $LB_IP"

      - name: Install/upgrade ArgoCD (idempotent)
        run: |
          set -euo pipefail
          helm repo add argo https://argoproj.github.io/argo-helm
          helm repo update
          helm upgrade --install argocd argo/argo-cd \
            -n argocd --create-namespace \
            -f deploy/doks/argocd-values.yaml \
            --wait --timeout 5m

      - name: Sync ArgoCD repo-credential secret (deploy key)
        env:
          ARGOCD_DEPLOY_KEY: ${{ secrets.ARGOCD_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          kubectl create secret generic lilac-repo-creds \
            --from-literal=type=git \
            --from-literal=url="$REPO_URL" \
            --from-literal=sshPrivateKey="$ARGOCD_DEPLOY_KEY" \
            --namespace argocd \
            --dry-run=client -o yaml \
            | kubectl label --local -f - argocd.argoproj.io/secret-type=repository -o yaml \
            | kubectl apply -f -

      - name: Apply ArgoCD AppProject + Application
        run: envsubst '$REPO_URL' < deploy/doks/argocd-app.yaml.tmpl | kubectl apply -f -

      - name: Checkout gitops/doks branch
        uses: actions/checkout@v6
        with:
          ref: gitops/doks
          path: gitops-doks

      - name: Render DO values-current.yaml and push to gitops/doks
        run: |
          set -euo pipefail
          envsubst '$REGISTRY_SERVER $DEPLOY_TAG $INGRESS_HOST' \
            < deploy/doks/values-overlay.yaml.tmpl > gitops-doks/deploy/doks/values-current.yaml
          cd gitops-doks
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deploy/doks/values-current.yaml
          if git diff --cached --quiet; then
            echo "values-current.yaml unchanged - skipping commit"
          else
            git commit -m "[skip ci] deploy $DEPLOY_TAG"
            git push origin gitops/doks
          fi

      - name: Sync via ArgoCD
        run: |
          set -euo pipefail
          # --core: talk to the Kubernetes API directly via the current
          # kubeconfig context (already set up by "Get DOKS kubeconfig" above)
          # instead of connecting to argocd-server over the network. No
          # port-forward, no admin-password lookup, no plaintext/insecure
          # flag juggling - and it sidesteps a flaky kubectl port-forward
          # pattern (worked for one curl, then refused the very next
          # connection - a known rough edge, not worth hardening further).
          #
          # --core reads argocd-cm/argocd-rbac-cm etc. from the kubeconfig
          # context's CURRENT namespace, not necessarily "argocd" - doctl's
          # kubeconfig defaults that to "default", so set it explicitly first.
          kubectl config set-context --current --namespace=argocd
          argocd login --core
          argocd app sync lilac-doks --core --timeout 300
          argocd app wait lilac-doks --core --health --timeout 300

      - name: Verify rollout
        run: |
          set -euo pipefail
          kubectl rollout status deployment/lilac-lilac-planner-backend -n lilac-planner --timeout=180s
          kubectl rollout status deployment/lilac-lilac-planner-frontend -n lilac-planner --timeout=180s

      - name: Public smoke check
        run: |
          set -euo pipefail
          echo "Checking https://$INGRESS_HOST from outside..."
          curl -sf --max-time 15 -o /dev/null "https://$INGRESS_HOST"
          echo "https://$INGRESS_HOST is serving."

      - name: Show cluster status
        if: always()
        run: |
          kubectl get pods -n lilac-planner -o wide
          echo "--- recent backend logs:"
          kubectl logs -n lilac-planner -l app.kubernetes.io/component=backend --tail 40 || true
