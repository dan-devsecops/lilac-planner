name: CD (Azure Kubernetes Service)

on:
  # Manual-only: AKS isn't an always-on environment like the DO droplet - the
  # cluster gets torn up/down for testing, so this must not auto-fire on every
  # push to main (it would just fail whenever the cluster is currently down).
  # Deploy the AKS leg by running this via "Run workflow", picking whichever
  # branch/ref you want deployed.
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to deploy (12-char commit SHA). Empty = build & deploy the latest commit on the selected ref."
        required: false
        default: ""

concurrency:
  group: cd-prod-azure
  cancel-in-progress: false

permissions:
  contents: write # required to push the rendered values-current.yaml to main
  id-token: write # required for azure/login's OIDC federated credential exchange

env:
  DEPLOY_SHA: ${{ github.sha }}
  REPO_URL: git@github.com:dan-devsecops/lilac-planner.git

jobs:
  build:
    name: Build & push ${{ matrix.component }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: inputs.tag == ''
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR
        run: az acr login --name "${{ vars.ACR_NAME }}"

      - name: Build image
        run: |
          set -euo pipefail
          TAG="${DEPLOY_SHA::12}"
          docker build -t "${{ vars.ACR_LOGIN_SERVER }}/lilac-planner-${{ matrix.component }}:$TAG" \
                       -t "${{ vars.ACR_LOGIN_SERVER }}/lilac-planner-${{ matrix.component }}:latest" \
                       "./${{ matrix.component }}"

      - name: Push image
        run: |
          set -euo pipefail
          TAG="${DEPLOY_SHA::12}"
          docker push "${{ vars.ACR_LOGIN_SERVER }}/lilac-planner-${{ matrix.component }}:$TAG"
          docker push "${{ vars.ACR_LOGIN_SERVER }}/lilac-planner-${{ matrix.component }}:latest"

  deploy:
    name: Deploy & verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    if: >
      always() && !cancelled() &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    environment: production
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Resolve image tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-${DEPLOY_SHA::12}}"
          echo "DEPLOY_TAG=$TAG" >> "$GITHUB_ENV"
          echo "Deploying image tag: $TAG"

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: azure/setup-kubectl@v4
      - uses: azure/setup-helm@v4

      - name: Install argocd CLI
        run: |
          set -euo pipefail
          curl -sSL -o /usr/local/bin/argocd \
            https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
          chmod +x /usr/local/bin/argocd

      - name: Get AKS credentials
        run: |
          # --admin: the cluster uses local accounts, not Azure AD RBAC (see
          # github-oidc.tf's comment on azurerm_role_assignment.github_aks
          # for the tradeoff and how to narrow this later).
          az aks get-credentials -g "${{ vars.AKS_RG }}" -n "${{ vars.AKS_NAME }}" --admin --overwrite-existing

      - name: Ensure namespace
        run: kubectl create namespace lilac-planner --dry-run=client -o yaml | kubectl apply -f -

      - name: Install/upgrade External Secrets Operator (idempotent)
        run: |
          set -euo pipefail
          # Replaces the old imperative "kubectl create secret ... from Key
          # Vault" step - lilac-db/lilac-auth are now ExternalSecret resources
          # (deploy/azure/external-secrets.yaml.tmpl), git-declared and
          # continuously reconciled by ArgoCD's "lilac-azure-secrets"
          # Application, not a one-shot CI action. This step only installs
          # the operator + its CRDs; the actual secrets are synced below via
          # ArgoCD, after the render-and-push step.
          helm repo add external-secrets https://charts.external-secrets.io
          helm repo update
          helm upgrade --install external-secrets external-secrets/external-secrets \
            -n external-secrets --create-namespace --wait --timeout 5m

      - name: Install/upgrade ingress-nginx + cert-manager (idempotent)
        run: |
          set -euo pipefail
          helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
          helm repo add jetstack https://charts.jetstack.io
          helm repo update
          # externalTrafficPolicy=Local is required on AKS: Azure's LB health
          # probe otherwise hits ingress-nginx's actual port 80 at "/", gets a
          # 404 (no matching Host header) and treats it as unhealthy - Azure
          # only accepts 200 as healthy - which silently drops ALL external
          # traffic even though everything internal still works. Local makes
          # Azure probe a dedicated kube-proxy health port instead.
          helm upgrade --install ingress-nginx ingress-nginx/ingress-nginx \
            -n ingress-nginx --create-namespace --wait --timeout 5m \
            --set controller.service.externalTrafficPolicy=Local
          helm upgrade --install cert-manager jetstack/cert-manager \
            -n cert-manager --create-namespace --set crds.enabled=true --wait --timeout 5m

      - name: Apply ClusterIssuer
        env:
          LETSENCRYPT_EMAIL: ${{ vars.LETSENCRYPT_EMAIL }}
        run: envsubst '$LETSENCRYPT_EMAIL' < deploy/azure/cluster-issuer.yaml | kubectl apply -f -

      - name: Install/upgrade ArgoCD (idempotent)
        run: |
          set -euo pipefail
          helm repo add argo https://argoproj.github.io/argo-helm
          helm repo update
          helm upgrade --install argocd argo/argo-cd \
            -n argocd --create-namespace \
            -f deploy/azure/argocd-values.yaml \
            --wait --timeout 5m

      - name: Sync ArgoCD repo-credential secret (deploy key)
        env:
          ARGOCD_DEPLOY_KEY: ${{ secrets.ARGOCD_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          kubectl create secret generic lilac-repo-creds \
            --from-literal=type=git \
            --from-literal=url="$REPO_URL" \
            --from-literal=sshPrivateKey="$ARGOCD_DEPLOY_KEY" \
            --namespace argocd \
            --dry-run=client -o yaml \
            | kubectl label --local -f - argocd.argoproj.io/secret-type=repository -o yaml \
            | kubectl apply -f -

      - name: Apply ArgoCD AppProject + Application
        run: envsubst '$REPO_URL' < deploy/azure/argocd-app.yaml.tmpl | kubectl apply -f -

      - name: Checkout main for the values-current.yaml commit
        uses: actions/checkout@v6
        with:
          ref: main
          path: main-checkout

      - name: Render Azure deploy manifests and push to main
        env:
          ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
          INGRESS_HOST: ${{ vars.INGRESS_HOST }}
          ADMIN_USERNAME: ${{ vars.ADMIN_USERNAME }}
          ADMIN_EMAIL: ${{ vars.ADMIN_EMAIL }}
          KEYVAULT_NAME: ${{ vars.KEYVAULT_NAME }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ESO_CLIENT_ID: ${{ vars.ESO_CLIENT_ID }}
        run: |
          set -euo pipefail
          # Lands on main, not a separate gitops/azure branch: ArgoCD's Applications
          # are single-source (see argocd-app.yaml.tmpl's comment) - every value/manifest
          # layer has to live on the same revision they sync from. [skip ci]
          # keeps this from triggering a pointless ci.yml run; cd-azure.yml itself
          # is workflow_dispatch-only, so this can't cascade into another deploy.
          envsubst '$ACR_LOGIN_SERVER $DEPLOY_TAG $INGRESS_HOST $ADMIN_USERNAME $ADMIN_EMAIL' \
            < deploy/azure/values-overlay.yaml.tmpl > main-checkout/deploy/azure/values-current.yaml

          mkdir -p main-checkout/deploy/azure/external-secrets
          envsubst '$ESO_CLIENT_ID $KEYVAULT_NAME $AZURE_TENANT_ID' \
            < deploy/azure/external-secrets.yaml.tmpl > main-checkout/deploy/azure/external-secrets/external-secrets-current.yaml

          cd main-checkout
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deploy/azure/values-current.yaml deploy/azure/external-secrets/external-secrets-current.yaml
          if git diff --cached --quiet; then
            echo "deploy manifests unchanged - skipping commit"
          else
            git commit -m "[skip ci] deploy $DEPLOY_TAG"
            git push origin main
          fi

      - name: Sync via ArgoCD
        run: |
          set -euo pipefail
          # --core: talk to the Kubernetes API directly via the current
          # kubeconfig context (already set up by "Get AKS credentials" above)
          # instead of connecting to argocd-server over the network. No
          # port-forward, no admin-password lookup, no plaintext/insecure
          # flag juggling - and it sidesteps a flaky kubectl port-forward
          # pattern seen on the DOKS leg (worked for one curl, then refused
          # the very next connection - a known rough edge, not worth
          # hardening further).
          #
          # --core reads argocd-cm/argocd-rbac-cm etc. from the kubeconfig
          # context's CURRENT namespace, not necessarily "argocd" - az aks
          # get-credentials defaults that to "default", so set it explicitly.
          kubectl config set-context --current --namespace=argocd
          argocd login --core

          # Secrets first - lilac-azure's pods need lilac-db/lilac-auth to
          # already exist, or they sit in ContainerCreating until ESO catches
          # up on its own refreshInterval instead of right away.
          argocd app sync lilac-azure-secrets --core --timeout 300
          argocd app wait lilac-azure-secrets --core --health --timeout 300

          argocd app sync lilac-azure --core --timeout 300
          argocd app wait lilac-azure --core --health --timeout 300

      - name: Verify rollout
        run: |
          set -euo pipefail
          # lilac-azure- not lilac-: ArgoCD names the Helm release after the
          # Application (lilac-azure), not the old pre-ArgoCD "lilac" release.
          kubectl rollout status deployment/lilac-azure-lilac-planner-backend -n lilac-planner --timeout=180s
          kubectl rollout status deployment/lilac-azure-lilac-planner-frontend -n lilac-planner --timeout=180s

      - name: Public smoke check
        env:
          INGRESS_HOST: ${{ vars.INGRESS_HOST }}
        run: |
          set -euo pipefail
          echo "Checking https://$INGRESS_HOST from outside..."
          curl -sf --max-time 15 -o /dev/null "https://$INGRESS_HOST"
          echo "https://$INGRESS_HOST is serving."

      - name: Show cluster status
        if: always()
        run: |
          kubectl get pods -n lilac-planner -o wide
          echo "--- recent backend logs:"
          kubectl logs -n lilac-planner -l app.kubernetes.io/component=backend --tail 40 || true
